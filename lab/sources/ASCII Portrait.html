<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ASCII Portrait</title>
  <style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #20231e;
  background: #f7f7f2;
  font-synthesis: none;
  --paper: #eaeae4;
  --ink: #20231e;
  --muted: #64695e;
  --line: #ddded5;
  --panel: #f0f0e9;
  --accent: #dce9ad;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button { color: inherit; font: inherit; cursor: pointer; }
button:disabled { opacity: .49; cursor: default; }
button:focus-visible, summary:focus-visible, canvas:focus-visible, pre:focus-visible {
  outline: 2px solid #616c3e;
  outline-offset: 2px;
}
button, input { -webkit-tap-highlight-color: transparent; }

.workspace {
  width: min(1600px, calc(100% - 72px));
  margin: 0 auto;
  padding: 27px 0 30px;
}
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.identity { display: flex; align-items: center; gap: 13px; min-width: 0; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(24px, 2.5vw, 36px); font-weight: 620; letter-spacing: -.06em; line-height: 1.12; }
.mark {
  display: grid; grid-template: repeat(3, 5px) / repeat(3, 5px); align-content: center; justify-content: center; gap: 3px;
  width: 40px; height: 40px; border: 1px solid #dedfd5; border-radius: 12px; color: #262b1f; background: #ebeddc;
}
.mark i { border-radius: 50%; background: currentColor; }
.mark i:nth-child(1), .mark i:nth-child(9) { transform: scale(.36); opacity: .6; }
.mark i:nth-child(2), .mark i:nth-child(6), .mark i:nth-child(8) { transform: scale(.69); }
.mark i:nth-child(3), .mark i:nth-child(7) { transform: scale(.44); }

.button {
  border: 1px solid transparent; border-radius: 100px; padding: 0 13px; min-height: 36px;
  display: inline-flex; justify-content: center; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 570; line-height: 1; white-space: nowrap;
  background: transparent;
}
.button [data-icon], .hint-pointer { width: 16px; height: 16px; display: inline-flex; flex: none; }
.icon { width: 100%; height: 100%; }
.export { min-height: 40px; padding-inline: 15px; background: var(--ink); color: #f8f9ef; border-color: var(--ink); }
.export:hover:not(:disabled) { background: #3c4332; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(313px, 27%, 369px); gap: 14px; align-items: start; }
.stage, .panel { border-radius: 23px; border: 1px solid var(--line); }
.stage {
  position: relative; isolation: isolate; overflow: hidden; display: grid; grid-template-rows: 64px minmax(0, 1fr);
  height: clamp(735px, calc(100dvh - 120px), 1040px); background: var(--paper);
  --stage-control: #dedfd7; --stage-border: #d2d4c9; --stage-hover: #f0f0e9; --stage-active: #fafbf3;
  --stage-muted: #535a4c;
}
.stage.night {
  --paper: #20231f; --stage-control: #31352d; --stage-border: #484e41; --stage-hover: #373c33;
  --stage-active: #424a3c; --stage-muted: #b8bcad; color: #eef0e4; border-color: #333830;
}
.stage-toolbar { height: 64px; padding: 15px 17px 10px; display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.segmented { display: flex; align-items: stretch; padding: 3px; gap: 2px; border-radius: 100px; background: #e3e4da; min-width: 0; }
.segmented button {
  background: transparent; border: 0; border-radius: 100px; padding: 0 10px; min-width: 0;
  line-height: 1; font-size: 12px; font-weight: 600; color: #4d5347; min-height: 28px;
}
.segmented button:not([aria-pressed="true"]):hover { background: #edeee5; }
.segmented button[aria-pressed="true"] { color: var(--ink); background: #fafbf3; box-shadow: 0 1px 2px #242b2210; }
.view-switch, .code-switch { background: var(--stage-control); }
.view-switch button, .code-switch button { min-height: 30px; padding-inline: 15px; color: var(--stage-muted); }
.view-switch button[aria-pressed="true"], .code-switch button[aria-pressed="true"] { background: var(--stage-active); color: inherit; }
.view-switch button:not([aria-pressed="true"]):hover, .code-switch button:not([aria-pressed="true"]):hover { background: var(--stage-hover); }
.original, .copy { border-color: var(--stage-border); }
.original:hover:not(:disabled), .copy:hover:not(:disabled) { background: var(--stage-hover); }
.original[aria-pressed="true"] { background: var(--stage-active); }

.preview { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 57px; }
.artwork { position: relative; min-height: 0; min-width: 0; }
#portrait { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#portrait.is-original { cursor: default; touch-action: auto; }
#portrait:focus-visible { outline-offset: -4px; }
.loading { position: absolute; inset: 50% 16px auto; text-align: center; font-size: 13px; color: var(--stage-muted); pointer-events: none; }
.stage-footer { display: flex; align-items: center; justify-content: space-between; gap: 13px; padding: 1px 17px 10px 20px; }
.stage-footer p { display: flex; align-items: center; gap: 7px; color: var(--stage-muted); font-size: 12px; line-height: 1.4; }
.hint-pointer { width: 14px; height: 14px; }
.demo { background: var(--stage-active); border-color: var(--stage-border); }
.demo:hover:not(:disabled) { background: var(--stage-hover); }
.demo[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: transparent; }
.demo [data-icon] { width: 13px; height: 13px; }

.panel {
  display: flex; flex-direction: column; background: var(--panel);
  min-height: clamp(735px, calc(100dvh - 120px), 1040px);
  max-height: clamp(735px, calc(100dvh - 120px), 1040px);
}
.panel-top { padding: 17px 18px 10px; }
.panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; gap: 12px; }
h2 { font-size: 23px; line-height: 1.1; font-weight: 640; letter-spacing: -.04em; }
.reset { min-height: 32px; padding: 0 9px; color: var(--muted); border-color: #d9dacf; font-size: 12px; }
.reset:hover:not(:disabled) { background: #e8e9df; color: var(--ink); }
.reset [data-icon] { width: 13px; height: 13px; }
.presets { display: flex; align-items: center; gap: 13px; font-size: 12px; font-weight: 600; color: var(--muted); }
.preset-switch { flex: 1; }
.preset-switch button { flex: 1; }
.preset-switch button[aria-pressed="true"] { background: var(--accent); }
.panel-controls { overflow: auto; padding: 0 18px 16px; scrollbar-width: thin; scrollbar-color: #c6c9bc transparent; }
.control-group { border-top: 1px solid #dbddd2; }
.control-group summary {
  display: flex; align-items: center; gap: 8px; list-style: none; min-height: 43px; width: 100%;
  cursor: pointer; font-size: 13px; font-weight: 650; user-select: none;
}
.control-group summary::-webkit-details-marker { display: none; }
.control-group summary:hover { color: #505a3a; }
.group-icon, .chevron { width: 15px; height: 15px; color: #646b5b; display: inline-flex; }
.chevron { margin-left: auto; color: #60675a; }
.control-group[open] .chevron { transform: rotate(180deg); }
.control-stack { display: grid; gap: 5px; padding-bottom: 12px; }
.range-row { position: relative; display: flex; align-items: stretch; min-height: 30px; border-radius: 8px; isolation: isolate; }
.range-row::before {
  content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: linear-gradient(90deg, #d6dacb 0 var(--amount, 0%), #e7e8df var(--amount, 0%) 100%);
}
.range-row:hover::before, .range-row:focus-within::before {
  background: linear-gradient(90deg, #d5dfb9 0 var(--amount, 0%), #e6e8dc var(--amount, 0%) 100%);
}
.range-row:focus-within { outline: 2px solid #6c7850; outline-offset: 1px; }
.range-row label, .range-row output { display: flex; align-items: center; pointer-events: none; white-space: nowrap; }
.range-row label { padding-left: 10px; font-size: 13px; font-weight: 540; color: #34392f; }
.range-row output {
  margin: 0 9px 0 auto; font: 500 11.5px/1 var(--mono); color: #24291f; font-variant-numeric: tabular-nums;
}
.range-row input { appearance: none; opacity: 0; width: 100%; margin: 0; position: absolute; inset: 0; height: 100%; cursor: ew-resize; }
.option-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; min-height: 35px; font-size: 12px; font-weight: 570; }
.option-row .segmented button { padding-inline: 12px; }
.option-row .glyph-switch button { width: 38px; padding: 0; font: 650 15px/1 var(--mono); }
.option-row .glyph-switch button:last-child { font-size: 11px; }
.toggle {
  align-items: center; padding: 3px; display: flex; border: 1px solid #c8cbbf; background: #e5e7de;
  width: 39px; height: 23px; border-radius: 100px;
}
.toggle::before { content: ''; display: block; width: 15px; height: 15px; border-radius: 100%; background: #6b7163; }
.toggle[aria-checked="true"] { background: var(--accent); border-color: #c2cf9a; }
.toggle[aria-checked="true"]::before { margin-left: auto; background: #3c472e; }

.code { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; padding: 0 17px 17px; }
.code-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 12px; }
.code pre {
  margin: 0; border-radius: 14px; border: 1px solid var(--stage-border); padding: 18px;
  background: var(--stage-active); height: 100%; overflow: auto; tab-size: 2; font: 12px/1.65 var(--mono);
}
.code pre code { font: inherit; }
.notice {
  position: fixed; z-index: 5; left: 50%; bottom: 20px; transform: translateX(-50%);
  max-width: calc(100% - 40px); padding: 11px 16px; border-radius: 14px;
  background: #272c23; color: #f8f9ee; font-size: 13px; box-shadow: 0 3px 14px #242a2127;
}

@media (max-width: 850px) {
  .workspace { width: calc(100% - 32px); padding-top: 19px; }
  .masthead { margin-bottom: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .stage { height: clamp(415px, 76vw, 670px); }
  .panel { min-height: 0; max-height: none; }
  .panel-controls { overflow: visible; }
}
@media (max-width: 480px) {
  .workspace { width: calc(100% - 20px); padding: 12px 0 20px; }
  .masthead { gap: 10px; margin-bottom: 12px; }
  .identity { gap: 8px; }
  h1 { font-size: 23px; }
  .mark { width: 33px; height: 33px; border-radius: 9px; }
  .export { min-height: 34px; padding-inline: 10px; font-size: 11px; }
  .stage, .panel { border-radius: 18px; }
  .stage { grid-template-rows: 52px minmax(0, 1fr); height: 420px; }
  .stage-toolbar { height: 52px; padding: 9px 10px 4px; }
  .preview { grid-template-rows: minmax(0, 1fr) 55px; }
  .stage-footer { padding: 0 11px 8px; gap: 8px; }
  .stage-footer p { font-size: 10.5px; }
  .demo, .original, .copy { min-height: 32px; padding-inline: 9px; font-size: 11px; }
  .hint-pointer { display: none; }
  .code { padding: 0 9px 9px; }
  .code-switch button { padding-inline: 7px; font-size: 10.5px; }
  .code pre { padding: 12px; font-size: 11px; }
  .range-row { min-height: 36px; }
}

</style>
</head>

  <div class="workspace">
    <header class="masthead">
      <div class="identity">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <h1>ASCII Portrait</h1>
      </div>
      <button class="button export" id="export" type="button" disabled>
        <span data-icon="download" aria-hidden="true"></span> Export PNG
      </button>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Portrait workspace">
        <header class="stage-toolbar">
          <div class="segmented view-switch" aria-label="Workspace view" role="group">
            <button id="preview-tab" type="button" aria-pressed="true" aria-controls="preview">Preview</button>
            <button id="code-tab" type="button" aria-pressed="false" aria-controls="code">Code</button>
          </div>
          <button class="button original" id="original" type="button" aria-pressed="false" disabled>
            <span data-icon="image" aria-hidden="true"></span><span>Original</span>
          </button>
        </header>

        <div class="preview" id="preview">
          <div class="artwork">
            <canvas id="portrait" tabindex="0" aria-label="Interactive dot portrait. Use arrow keys to move the effect and Enter to send a ripple.">
              An interactive halftone portrait.
            </canvas>
            <p class="loading" id="loading" role="status">Opening portrait…</p>
          </div>
          <footer class="stage-footer">
            <p id="interaction-hint"><span class="hint-pointer" data-icon="pointer" aria-hidden="true"></span><span id="hint-text">Move to leave a trail. Click to send a ripple.</span></p>
            <button class="button demo" id="demo" type="button" aria-pressed="false" disabled>
              <span id="demo-icon" data-icon="play" aria-hidden="true"></span><span id="demo-label">Play demo</span>
            </button>
          </footer>
        </div>

        <div class="code" id="code" hidden>
          <div class="code-toolbar">
            <div class="segmented code-switch" id="code-switch" role="group" aria-label="Source file"></div>
            <button class="button copy" id="copy" type="button"><span data-icon="copy" aria-hidden="true"></span><span>Copy</span></button>
          </div>
          <pre tabindex="0" aria-label="Source code"><code id="code-body"></code></pre>
        </div>
      </section>

      <aside class="panel" aria-labelledby="panel-title">
        <div class="panel-top">
          <div class="panel-title">
            <h2 id="panel-title">Tweak</h2>
            <button class="button reset" id="reset" type="button" disabled>
              <span data-icon="reset" aria-hidden="true"></span> Reset
            </button>
          </div>
          <div class="presets">
            <span id="preset-title">Preset</span>
            <div class="segmented preset-switch" id="presets" role="group" aria-labelledby="preset-title"></div>
          </div>
        </div>
        <div class="panel-controls" id="controls"></div>
      </aside>
    </main>
    <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>
  </div>

 role=\"alert\" style={{ position: 'relative', margin: 0, padding: 16 }}>{error}\u003c/p>}\n    \u003c/div>\n  );\n}\n","portrait-wake.js":"export const GLYPHS = {\n  Classic: ['·', ':', '-', '=', '+', '*', '#', '%', '@'],\n  Blocks: ['·', '░', '▒', '▓', '█'],\n  Dots: ['·', '•', '▪', '●'],\n  Binary: ['·', '.', ':', '0', '1'],\n};\n\nexport const DEFAULT_SETTINGS = Object.freeze({\n  size: 4.5,\n  weight: 92,\n  contrast: 116,\n  brightness: 0,\n  background: 0,\n  zoom: 91,\n  glyphs: 'Classic',\n  reach: 79,\n  trail: 1.25,\n  pull: 30,\n  intensity: 87,\n  flicker: 24,\n  ripple: true,\n  strength: 74,\n  duration: 2.15,\n  band: 32,\n  theme: 'Paper',\n  guides: false,\n});\n\nexport const PALETTES = {\n  Paper: { background: '#eaeae4', ink: '#20231e', grid: '#d2d3ca', lightInk: false },\n  Night: { background: '#20231f', ink: '#eef0e4', grid: '#383c34', lightInk: true },\n};\n\nconst MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';\nconst clamp = (v, min, max) => Math.max(min, Math.min(max, v));\nconst unit = (v) => clamp(v, 0, 1);\nconst smooth = (v) => {\n  const t = unit(v);\n  return t * t * (3 - 2 * t);\n};\n\nfunction noise(index, tick) {\n  const value = (index * 374761393 + tick * 668265263) | 0;\n  const mixed = Math.imul(value ^ (value >>> 13), 1274126177);\n  return ((mixed ^ (mixed >>> 16)) >>> 0) / 4294967296;\n}\n\nfunction loadImage(src) {\n  return new Promise((resolve, reject) => {\n    const image = new Image();\n    image.onload = () => resolve(image);\n    image.onerror = () => reject(new Error('The portrait image could not be opened.'));\n    image.src = src;\n  });\n}\n\nfunction pixelsOf(image, width, height) {\n  const buffer = document.createElement('canvas');\n  buffer.width = width;\n  buffer.height = height;\n  const context = buffer.getContext('2d', { willReadFrequently: true });\n  context.drawImage(image, 0, 0, width, height);\n  const pixels = context.getImageData(0, 0, width, height).data;\n  const grayscale = new Uint8Array(width * height);\n  for (let i = 0, p = 0; i \u003c grayscale.length; i++, p += 4) {\n    grayscale[i] = Math.round(pixels[p] * 0.2126 + pixels[p + 1] * 0.7152 + pixels[p + 2] * 0.0722);\n  }\n  return grayscale;\n}\n\n/** Mount a portrait renderer on an existing canvas. Serve external images from the same origin. */\nexport function createPortraitWake(canvas, { image, matte, settings: initial = {}, onManualInput } = {}) {\n  const ctx = canvas.getContext('2d', { alpha: false });\n  const settings = { ...DEFAULT_SETTINGS, ...initial };\n  const controller = new AbortController();\n  const pointer = { x: 0, y: 0, level: 0, present: false, previous: null };\n  const toneKeys = ['size', 'weight', 'contrast', 'brightness', 'background', 'zoom', 'theme'];\n  let source = null;\n  let width = 0, height = 0, ratio = 1;\n  let rect = null;\n  let points = [], stepX = 0, stepY = 0, cols = 0, rows = 0, gridX = 0, gridY = 0;\n  let original = false, destroyed = false, touchId = null;\n  let lastTime = 0, shimmerTime = 0, tick = 0, frame = 0, hadHeat = false;\n  let rings = [];\n  let demo = null;\n\n  function buildGrid() {\n    if (!source || width \u003c 2 || height \u003c 2) return;\n    const scale = Math.min(width / source.width, height / source.height) * (settings.zoom / 100);\n    const w = source.width * scale;\n    const h = source.height * scale;\n    rect = { x: (width - w) / 2, y: (height - h) / 2, w, h };\n    stepX = Math.max(2.25, settings.size * Math.min(1, width / 610));\n    stepY = stepX * Math.sqrt(3) / 2;\n    gridX = rect.x + (rect.w % stepX) / 2;\n    gridY = rect.y + (rect.h % stepY) / 2;\n    cols = Math.floor(rect.w / stepX);\n    rows = Math.floor(rect.h / stepY);\n    points = new Array(cols * rows);\n    const palette = PALETTES[settings.theme] ?? PALETTES.Paper;\n    const sampleOffset = Math.min(\n      Math.floor((Math.min(source.width, source.height) - 1) / 2),\n      Math.max(1, Math.floor(stepX / scale / 4)),\n    );\n    cons
