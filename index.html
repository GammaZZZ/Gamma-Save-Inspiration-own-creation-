<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计工具索引</title>
<link rel="stylesheet" href="./lab/gallery.css?v=3">
<style>
:root{
  --bg:#FFFFFF; --side:#F7F9FC; --panel:#EDF1F7; --tile:#EFF2F7; --hover:#F0F4FA;
  --ink:#192231; --ink-2:#536175; --ink-3:#66768A;
  --line:#E3E9F1; --accent:#315FAA; --accent-soft:rgba(49,95,170,.12);
  --seen-bg:#EDF2F9; --seen-bar:#AEBFD7;
  --edge:#EEF2F7;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",
     "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --fm:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B26; --side:#182131; --panel:#232F42; --tile:#243044; --hover:#212D3E;
    --ink:#F0F4FA; --ink-2:#BEC9D9; --ink-3:#99AAC0;
    --line:#304058; --accent:#86B4FF; --accent-soft:rgba(134,180,255,.16);
    --seen-bg:#212E42; --seen-bar:#577296;
    --edge:#101621;
  }
}
:root[data-theme="dark"]{
  --bg:#141B26; --side:#182131; --panel:#232F42; --tile:#243044; --hover:#212D3E;
  --ink:#F0F4FA; --ink-2:#BEC9D9; --ink-3:#99AAC0;
  --line:#304058; --accent:#86B4FF; --accent-soft:rgba(134,180,255,.16);
  --seen-bg:#212E42; --seen-bar:#577296;
  --edge:#101621;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;color:var(--ink);font-family:var(--f);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.003em;
  background:var(--edge)}
.page{position:relative;z-index:1;max-width:1060px;margin:22px auto;background:var(--bg);
  min-height:calc(100vh - 44px);border-radius:18px;overflow:clip;
  box-shadow:0 0 0 1px var(--line),0 10px 44px rgba(20,20,40,.09)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 44px)}

/* ---------- sidebar ---------- */
.side{min-width:0;background:var(--side);border-right:1px solid var(--line)}
.side-inner{position:sticky;top:0;height:calc(100dvh - 44px);overflow-y:auto;padding:16px 12px 12px;
  display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 4px}
.mark{flex:none;width:38px;height:38px;border-radius:50%;object-fit:cover;
  box-shadow:0 1px 4px rgba(0,0,0,.12)}
.brand{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.tagline{font-size:10.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.side hr{border:0;margin:1px 0}
.nav{display:flex;flex-direction:column;gap:0}
.nav button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
  color:var(--ink-2);font-family:var(--f);font-size:11.8px;text-align:left;
  padding:3.5px 8px;border-radius:7px;cursor:pointer;
  transition:background .16s ease,color .16s ease}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button:active{background:var(--panel)}
.nav button.on{background:var(--panel);color:var(--ink);font-weight:600;
  box-shadow:0 0 0 1px var(--line)}
.nav svg{flex:none;color:var(--ink-3);transition:color .18s ease}
.nav button.on svg{color:var(--accent)}
.nav .nav-lab{margin-bottom:5px}
.nav .cnt{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px 6px 0;
  font-size:10px;color:var(--ink-3)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 auto;max-width:380px}
.search input{width:100%;height:31px;border:0;border-radius:999px;background:var(--panel);
  color:var(--ink);font-family:var(--f);font-size:13px;padding:0 14px 0 33px;
  transition:box-shadow .2s ease,background .2s ease}
.search input:focus{outline:0;background:var(--bg);box-shadow:0 0 0 2px var(--accent-soft),0 0 0 1px var(--line)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:8.5px;color:var(--ink-3)}
.kbd{font-family:var(--fm);font-size:10px;color:var(--ink-3);background:var(--panel);
  border-radius:5px;padding:2px 6px}
.tbtn{height:31px;padding:0 13px;border:0;border-radius:999px;background:var(--panel);
  color:var(--ink);font-family:var(--f);font-size:12.5px;cursor:pointer;white-space:nowrap}
.tbtn{transition:background .18s ease,box-shadow .18s ease,transform .18s cubic-bezier(.2,.8,.3,1),color .18s}
.tbtn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--line)}
.tbtn:active{transform:scale(.96)}
.tbtn.on{background:var(--accent);color:var(--bg)}
.tbtn.ghost{background:transparent;color:var(--accent)}
.spacer{margin-left:auto}

/* ---------- list ---------- */
main{padding:0 22px 20px}
section{padding-top:26px;animation:rise .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.act{transition:color .16s ease,background .16s ease,transform .16s cubic-bezier(.2,.8,.3,1)}
.act:active{transform:scale(.88)}
.toast{animation:rise .28s cubic-bezier(.2,.8,.3,1) both}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h .num{font-family:var(--fm);font-size:11px;color:var(--ink-3)}
.sec-h h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.015em}
.sec-h .note{font-size:12px;color:var(--ink-3)}
.sec-h .cnt{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--ink-3)}

.list{columns:1;column-gap:26px}
@media (min-width:1000px){ .list{columns:2} }
.row{display:flex;align-items:center;gap:9px;min-width:0;padding:4px 8px;
  margin-left:-8px;border-radius:8px;position:relative;break-inside:avoid;
  -webkit-column-break-inside:avoid;
  transition:background .16s ease}
.row:hover,.row:focus-within{background:var(--hover)}
.row:active{background:var(--panel)}
.row .n,.row .d{transition:color .2s ease}
.row:hover .n{color:var(--accent)}
.row .ic{transition:opacity .16s ease}
.ic{position:relative;flex:0 0 20px;width:20px;height:20px;border-radius:6px;overflow:hidden;
  background:var(--tile);display:grid;place-items:center}
.ic img{width:20px;height:20px;object-fit:contain;opacity:0;transition:opacity .18s}
.ic img.ok{opacity:1}
.ic .ltr{position:absolute;font-size:10.5px;font-weight:600;color:var(--ink-2)}
.ic img.ok+.ltr{display:none}
.n{font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto;max-width:46%;
  overflow:hidden;text-overflow:ellipsis}
.dot{color:var(--ink-3);font-size:10px;flex:0 0 auto}
.d{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1 1 auto}

/* ---------- 作品集画廊 ---------- */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:620px){ .gal{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1000px){ .gal{grid-template-columns:repeat(3,minmax(0,1fr))} }
.pcard{display:flex;flex-direction:column;gap:9px;border-radius:14px;min-width:0;
}
.pcard:hover .shotbox,.pcard:focus-visible .shotbox{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 32%,var(--line)),0 4px 16px rgba(29,49,80,.10)}
.shotbox{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:14px;
  background:var(--panel);transition:box-shadow .16s ease;box-shadow:0 0 0 1px var(--line),0 2px 10px rgba(20,20,40,.06);
  display:block}
.shotbox img{position:absolute;top:0;left:0;width:100%;height:auto;display:block;
  opacity:0;transition:opacity .4s ease;will-change:transform}
.shotbox img.ok{opacity:1}
.shotbox .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:16px;font-size:11px;color:var(--ink-3);line-height:1.5}
.shotbox .ph b{display:block;font-size:15px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.shotbox.loaded .ph{display:none}
.shotbox .sweep{position:absolute;inset:0;
  background:linear-gradient(100deg,var(--panel) 30%,var(--hover) 50%,var(--panel) 70%);
  background-size:220% 100%;animation:sweep 1.6s linear infinite}
.shotbox.loaded .sweep,.shotbox.failed .sweep{display:none}
.pname{display:flex;align-items:baseline;gap:8px;min-width:0;padding:0 2px}
.pname b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:color .2s ease;flex:0 1 auto;max-width:100%}
.pcard:hover .pname b{color:var(--accent)}
.pname .pnote{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-style:italic;flex:1 1 0;min-width:0}
.pname .phost{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--ink-3);
  white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pcard.seen .pname b{color:var(--ink-3);font-weight:500}
.pcard.seen .shotbox{opacity:.72}
.pcard.last .shotbox{box-shadow:0 0 0 2px var(--seen-bar),0 2px 10px rgba(20,20,40,.06)}
@media (prefers-reduced-motion:reduce){ .shotbox img{transform:none!important} }

/* 打开过的标记 */
.row.seen .n{color:var(--ink-3);font-weight:500}
.row.seen .ic{opacity:.55}
.row.seen:hover .n{color:var(--accent)}
.seen-dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink-3);
  opacity:.5;display:none}
.row.seen .seen-dot{display:block}
.row.last{background:var(--seen-bg);box-shadow:inset 2px 0 0 var(--seen-bar)}
.row.last .n{color:var(--ink-2);font-weight:600}
.row.last .ic{opacity:.8}
.row.last .seen-dot{display:block;background:var(--seen-bar);opacity:1}

.act{flex:0 0 20px;width:20px;height:20px;border:0;padding:0;border-radius:6px;
  background:transparent;color:var(--ink-3);cursor:pointer;display:none;place-items:center}
.row:hover .act,.row:focus-within .act,.act.on{display:grid}
.act.on{color:#F5A623}
.act:hover{color:#F5A623;background:var(--panel)}
.act.del:hover{color:#FF3B30}

.empty{padding:80px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:5px}
.pagefoot{margin:34px 24px 0;padding:16px 0 30px;
  font-size:11.5px;color:var(--ink-3);font-family:var(--fm)}

/* ---------- hover 预览 ---------- */
.pv{position:fixed;z-index:70;width:320px;aspect-ratio:16/10;border-radius:13px;overflow:hidden;
  background:var(--panel);box-shadow:0 0 0 1px var(--line),0 16px 46px rgba(20,20,40,.20);
  opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;left:0;top:0;
  transition:opacity .26s ease,transform .26s cubic-bezier(.2,.8,.3,1),
             left .2s cubic-bezier(.2,.8,.3,1),top .2s cubic-bezier(.2,.8,.3,1)}
.pv.show{opacity:1;transform:translateY(0) scale(1)}
.pv::before{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,var(--panel) 30%,var(--hover) 50%,var(--panel) 70%);
  background-size:220% 100%;animation:sweep 1.5s linear infinite}
.pv.loaded::before{animation:none;opacity:0;transition:opacity .3s}
@keyframes sweep{to{background-position:-120% 0}}
.pv .shot{position:relative;display:block;width:100%;height:100%;object-fit:cover;
  object-position:top center;opacity:0;transition:opacity .34s ease}
.pv.loaded .shot{opacity:1}
@media (max-width:860px){ .pv{display:none} }

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);
  display:grid;place-items:center;padding:20px}
.modal{width:min(400px,100%);max-height:86vh;overflow:auto;background:var(--bg);
  border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal h3{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.modal p.note{font-size:12.5px;color:var(--ink-2);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11.5px;color:var(--ink-2)}
.field input,.field select,.field textarea{height:35px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:13px;width:100%}
.field textarea{height:58px;padding:8px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--accent)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.acts .tbtn.go{background:var(--accent);color:var(--bg)}
.hintline{font-size:12px;color:var(--ink-3);margin-top:11px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px}

@media (max-width:860px){
  .page{margin:0;border-radius:0;min-height:100vh}
  .shell{grid-template-columns:1fr;min-height:0}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side-inner{position:static;height:auto;overflow:visible;padding:18px 16px;gap:14px}
  .mark{width:38px;height:38px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px;margin-top:0}
  .nav button{width:auto;padding:5px 9px;font-size:12px}
  .side-foot{display:none}
  .topbar{padding:9px 16px} main{padding:0 16px 10px}
  .pagefoot{margin:24px 16px 0}
  .n{max-width:100%} .d{display:none}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function loadSeen(){
  try {
    const raw = localStorage.getItem("seen-sites");
    if (raw){ const o = JSON.parse(raw); state.seen = new Set(o.ids || []); state.last = o.last || ""; }
  } catch {}
}
function saveSeen(){
  try { localStorage.setItem("seen-sites",
        JSON.stringify({ ids: [...state.seen], last: state.last })); } catch {}
  if (db){ db.doc("prefs/seen").set({ ids: [...state.seen], last: state.last }).catch(() => {}); }
}

function matches(it){
  if (state.starsOnly && !state.stars.has(it.id)) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return it.c === state.cat;          // 没搜索时只看当前分类
  const c = CATMAP[it.c] || {};                // 搜索时跨全部分类
  const hay = [it.n, it.d, (it.t||[]).join(" "), it.u, c.cn, c.en].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

let shotBoxes = [], shotRaf = 0, shotObs = null;
function setupShots(){
  shotBoxes = [...document.querySelectorAll(".shotbox")];
  if (shotObs) shotObs.disconnect();
  shotObs = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      loadShot(e.target); obs.unobserve(e.target);
    });
  }, { rootMargin: "600px 0px" });
  shotBoxes.forEach(b => shotObs.observe(b));
  panShots();
}
function loadShot(box){
  if (box.querySelector("img")) return;
  const img = document.createElement("img");
  img.alt = ""; img.decoding = "async";
  img.addEventListener("load", () => {
    if (img.naturalWidth < 60){ box.classList.add("failed"); img.remove(); return; }
    box.classList.add("loaded"); img.classList.add("ok"); panShots();
  });
  img.addEventListener("error", () => {
    const i = (+box.dataset.i || 0) + 1;
    if (i >= SHOT_FULL.length){ box.classList.add("failed"); img.remove(); return; }
    box.dataset.i = i; img.src = SHOT_FULL[i](box.dataset.u);
  });
  box.appendChild(img);
  img.src = SHOT_FULL[0](box.dataset.u);
}
function panShots(){
  if (shotRaf) return;
  shotRaf = requestAnimationFrame(() => {
    shotRaf = 0;
    const vh = window.innerHeight;
    for (const box of shotBoxes){
      const img = box.querySelector("img");
      if (!img || !img.classList.contains("ok")) continue;
      const r = box.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) continue;
      const range = img.offsetHeight - box.offsetHeight;
      if (range <= 0) continue;
      let prog = (vh - r.top) / (vh + r.height);
      prog = Math.max(0, Math.min(1, prog));
      img.style.transform = `translate3d(0,${-(range * prog).toFixed(1)}px,0)`;
    }
  });
}
window.addEventListener("scroll", panShots, { passive: true });
window.addEventListener("resize", panShots, { passive: true });

function render(){
  ITEM_BY_ID = Object.fromEntries(all().map(it => [it.id, it]));
  const shown = all().filter(matches);
  const counts = {};
  all().forEach(it => counts[it.c] = (counts[it.c]||0) + 1);
  document.getElementById("nav").innerHTML =
    `<button class="nav-lab ${state.cat === LAB ? "on" : ""}" type="button" data-cat="${LAB}"
        aria-pressed="${state.cat === LAB}">${LAB_ICON}组件实验室<span class="cnt">4</span></button>` +
    CATS.map(c => `<button class="${state.cat===c.code && !state.q ? "on" : ""}" data-cat="${c.code}"
        type="button" title="${esc(c.note)}">${icon(c.code)}${esc(c.cn)}
        <span class="cnt">${counts[c.code]||0}</span></button>`).join("");

  const main = document.getElementById("main");
  const search = document.getElementById("q");
  const inLab = state.cat === LAB;
  if (inLab && !location.hash) history.replaceState(null, "", LAB_HASH);
  if (!inLab && location.hash === LAB_HASH) history.replaceState(null, "", location.pathname + location.search);
  search.placeholder = inLab ? "搜索组件名称或交互" : "搜索名称、用途、标签（跨全部分类）";
  search.setAttribute("aria-label", inLab ? "搜索组件" : "搜索网站");

  if (inLab) {
    const existingHost = main.querySelector("#lab-gallery");
    if (existingHost) {
      labController?.update(state.q);
      return;
    }
    main.innerHTML = `<section aria-labelledby="lab-heading">
      <div class="sec-h"><h2 id="lab-heading">组件实验室</h2>
        <span class="note">试试交互，也可以查看并下载 React 源码。</span></div>
      <div id="lab-gallery"><div class="empty" role="status">正在加载组件…</div></div>
    </section>`;
    const host = main.querySelector("#lab-gallery");
    import("./lab/gallery.js?v=2")
      .then(({mountGallery}) => {
        if (host.isConnected) labController = mountGallery(host, state.q);
      })
      .catch(() => {
        if (host.isConnected) host.innerHTML = '<div class="empty" role="status"><b>组件暂未加载</b>刷新页面后再试。</div>';
      });
    return;
  }
  labController?.unmount();
  labController = null;
  if (!shown.length){
    main.innerHTML = `<div class="empty"><b>没有匹配的网站</b>换个关键词，或在左边挑一个分类。</div>`;
    return;
  }
  main.innerHTML = CATS.map(c => {
    const list = shown.filter(it => it.c === c.code);
    if (!list.length) return "";
    const gal = GALLERY.has(c.code);
    return `<section>
      <div class="sec-h"><span class="num">${c.code}</span><h2>${esc(c.cn)}</h2>
        <span class="note">${esc(c.note)}</span><span class="cnt">${list.length}</span></div>
      <div class="${gal ? "gal" : "list"}">${list.map(gal ? cardHTML : rowHTML).join("")}</div>
    </section>`;
  }).join("");
  if (document.querySelector(".shotbox")) setupShots();
}

const pv = document.getElementById("pv"), pvShot = document.getElementById("pvShot");
let pvTimer = null, pvId = "";
const SHOT = [
  u => `https://s.wordpress.com/mshots/v1/${encodeURIComponent(u)}?w=600`,
  u => `https://image.thum.io/get/width/600/crop/500/${u}`,
];
pvShot.addEventListener("load", () => {
  if (pvShot.naturalWidth < 40){ pv.classList.remove("show"); return; }
  pv.classList.add("loaded");
});
pvShot.addEventListener("error", () => {
  const i = (+pvShot.dataset.i || 0) + 1;
  if (i >= SHOT.length){ pv.classList.remove("show"); return; }
  pvShot.dataset.i = i; pvShot.src = SHOT[i](pvShot.dataset.u);
});

function placePv(rect){
  const w = 320, h = pv.offsetHeight || 200, gap = 14;
  let left = rect.right + gap;
  if (left + w > window.innerWidth - 10) left = rect.left - w - gap;
  if (left < 10) left = Math.max(10, window.innerWidth - w - 10);
  let top = rect.top + rect.height / 2 - h / 2;
  top = Math.max(60, Math.min(top, window.innerHeight - h - 12));
  pv.style.left = left + "px"; pv.style.top = top + "px";
}
function showPv(row){
  const it = ITEM_BY_ID[row.dataset.open];
  if (!it) return;
  pvId = it.id;
  pv.classList.remove("loaded");
  pvShot.removeAttribute("src");
  pvShot.dataset.i = 0; pvShot.dataset.u = it.u;
  placePv(row.getBoundingClientRect());
  pv.classList.add("show");
  pvShot.src = SHOT[0](it.u);
}
function hidePv(){ clearTimeout(pvTimer); pv.classList.remove("show"); pvId = ""; }
document.addEventListener("mouseover", e => {
  const row = e.target.closest(".row");
  if (!row){ hidePv(); return; }
  if (row.dataset.open === pvId) return;
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => showPv(row), 430);
});
window.addEventListener("scroll", hidePv, { passive: true });

document.getElementById("starBtn").addEventListener("click", e => {

  ["f-name","f-url","f-desc","f-tags"].forEach(id => document.getElementById(id).value = "");

async function saveSite(){
  const n = document.getElementById("f-name").value.trim();
  let u = document.getElementById("f-url").value.trim();
  if (!n){ toast("先填个名称"); return; }
  if (!u){ toast("还差网址"); return; }
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  const rec = {
    name: n, url: u, cat: document.getElementById("f-cat").value,
    desc: document.getElementById("f-desc").value.trim(),
    tags: document.getElementById("f-tags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    createdAt: new Date().toISOString()
  };
  const id = "u-" + Date.now().toString(36);
  state.custom.push(toItem(id, rec));
  state.cat = rec.cat;
  state.directoryCat = rec.cat;
  document.getElementById("q").value = "";
  state.q = "";
  closeModal(); render(); toast(`已添加 ${n}`);
  if (db){
    try { await db.doc("sites/" + id).set(rec); }
    catch (err){ toast("没能保存到云端，刷新后可能会不见"); }
  }
}

function toItem(id, r){
  return { id, c: CATMAP[r.cat] ? r.cat : "01", n: r.name, u: r.url,
           d: r.desc || "", t: r.tags || [], mine: true };
}

async function removeSite(id){
  state.custom = state.custom.filter(x => x.id !== id);
  render();
  if (db){ try { await db.doc("sites/" + id).delete(); } catch {} }
}

async function toggleStar(id){
  state.stars.has(id) ? state.stars.delete(id) : state.stars.add(id);
  render();
  if (db){ try { await db.doc("prefs/stars").set({ ids: [...state.stars] }); } catch {} }
}

if (location.hash === LAB_HASH) state.cat = LAB;
render();
window.addEventListener("hashchange", () => {
  const target = location.hash === LAB_HASH ? LAB : state.directoryCat;
  if (target !== state.cat) document.querySelector(`[data-cat="${target}"]`).click();
});

(async () => {
  db = await (window.claude?.use?.("db") ?? Promise.resolve(null));
  const el = document.getElementById("dbState");
  if (!db){ el.textContent = "收藏与新增仅保存在本次浏览"; return; }
  el.textContent = "收藏与新增已同步保存";
  db.collection("sites").onSnapshot(snap => {
    state.custom = snap.docs.map(d => toItem(d.id, d.data() || {}));
    render();
  }, () => {});
  db.doc("prefs/stars").onSnapshot(snap => {
    const ids = (snap.data() || {}).ids;
    if (Array.isArray(ids)) { state.stars = new Set(ids); render(); }
  }, () => {});
  db.doc("prefs/seen").onSnapshot(snap => {
    const o = snap.data() || {};
    if (Array.isArray(o.ids)){
      o.ids.forEach(i => state.seen.add(i));
      if (o.last && !state.last) state.last = o.last;
      render();
    }
  }, () => {});
})();
</script>
